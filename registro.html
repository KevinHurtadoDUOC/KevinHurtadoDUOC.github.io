<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro | El Volcán</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="registro">
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand" aria-label="Distribuidora de Gas El Volcán">
          <div class="brand-mark">EV</div>
          <div class="brand-text">
            <span>Distribuidora de Gas</span>
            <strong>El Volcán</strong>
          </div>
        </div>

        <nav class="main-nav" aria-label="Navegación principal">
          <a href="index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="index.html#about">Quiénes somos</a>
          <a href="index.html#contact">Contáctanos</a>
        </nav>

        <div class="nav-actions">
          <a href="carrito.html" class="cart-link" aria-label="Ver carrito">
            <span class="cart-icon">🛒</span>
            <span id="cart-count" class="cart-count">0</span>
          </a>
          <a href="login.html" class="btn btn-light">Iniciar sesión</a>
          <a href="registro.html" class="btn btn-primary">Registrarse</a>
        </div>
      </div>
    </header>

    <main>
      <section class="auth-section">
        <div class="container auth-shell">
          <div class="auth-card">
            <span class="eyebrow accent">Registro</span>
            <h1>Crea tu cuenta</h1>
            <form id="register-form" class="auth-form">
              <div class="form-row two-columns">
                <label>
                  Nombre
                  <input type="text" name="nombre" placeholder="Tu nombre" required />
                </label>
                <label>
                  Apellido
                  <input type="text" name="apellido" placeholder="Tu apellido" required />
                </label>
              </div>

              <div class="form-row two-columns">
                <label>
                  Fecha de nacimiento
                  <input type="date" name="fechaNacimiento" required />
                </label>
                <label>
                  Género
                  <select name="genero" required>
                    <option value="">Selecciona</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="No binario">No binario</option>
                    <option value="Prefiero no decir">Prefiero no decir</option>
                  </select>
                </label>
              </div>

              <div class="form-row two-columns">
                <label>
                  Correo
                  <input type="email" name="email" placeholder="nombre@duoc.cl" required />
                </label>
                <label>
                  Región
                  <select name="region" required>
                    <option value="">Selecciona</option>
                    <option value="Metropolitana">Metropolitana</option>
                    <option value="Valparaíso">Valparaíso</option>
                    <option value="Biobío">Biobío</option>
                    <option value="La Araucanía">La Araucanía</option>
                    <option value="Otra">Otra</option>
                  </select>
                </label>
              </div>

              <label>
                Dirección
                <input type="text" name="direccion" placeholder="Tu dirección" required />
              </label>

              <div class="form-row two-columns">
                <label>
                  Contraseña
                  <input type="password" name="password" placeholder="Mínimo 8 caracteres" required />
                </label>
                <label>
                  Confirmar contraseña
                  <input type="password" name="confirmPassword" placeholder="Repite tu contraseña" required />
                </label>
              </div>

              <label class="checkbox-wrap">
                <input type="checkbox" name="terms" required />
                <span>Acepto los términos y condiciones.</span>
              </label>

              <button type="submit" class="btn btn-primary full-width">Crear cuenta</button>
              <p class="auth-link">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
