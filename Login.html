<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | El Volcán</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body data-page="login">
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand" aria-label="Distribuidora de Gas El Volcán">
          <div class="brand-mark">EV</div>
          <div class="brand-text">
            <span>Distribuidora de Gas</span>
            <strong>El Volcán</strong>
          </div>
        </div>

        <nav class="main-nav" aria-label="Navegación principal">
          <a href="index.html">Inicio</a>
          <a href="catalogo.html">Catálogo</a>
          <a href="index.html#about">Quiénes somos</a>
          <a href="index.html#contact">Contáctanos</a>
        </nav>

        <div class="nav-actions">
          <a href="carrito.html" class="cart-link" aria-label="Ver carrito">
            <span class="cart-icon">🛒</span>
            <span id="cart-count" class="cart-count">0</span>
          </a>
          <a href="login.html" class="btn btn-light">Iniciar sesión</a>
          <a href="registro.html" class="btn btn-primary">Registrarse</a>
        </div>
      </div>
    </header>

    <main>
      <section class="auth-section">
        <div class="container auth-shell">
          <div class="auth-card">
            <span class="eyebrow accent">Ingreso</span>
            <h1>Bienvenido nuevamente</h1>
            <form id="login-form" class="auth-form">
              <label>
                Correo
                <input type="email" name="email" placeholder="nombre@duoc.cl" required />
              </label>

              <label>
                Contraseña
                <input type="password" name="password" placeholder="Tu contraseña" required />
              </label>

              <button type="submit" class="btn btn-primary full-width">Ingresar</button>
              <p class="auth-link">
                ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
